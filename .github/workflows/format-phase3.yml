name: Phase 3 format helper

on:
  push:
    branches:
      - feat/mobile-phase-3-campus

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-phase-3-campus
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format final Campus screen and remove helper
        run: |
          npx prettier --write "app/(tabs)/campus.tsx"
          rm .github/workflows/format-phase3.yml
      - name: Commit formatting
        run: |
          git config user.name "Andrew Muratov"
          git config user.email "andrewamuratov@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: format campus selector"
          git push origin HEAD:feat/mobile-phase-3-campus
