name: Format Phase 4

on:
  push:
    branches: [feat/mobile-phase-4-auth-continuity]
    paths:
      - "src/features/auth/cloud-restore-model.ts"
      - "src/features/auth/cloud-restore.ts"
      - "src/features/timetable/store.tsx"
      - "tests/cloud-restore-model.test.ts"
      - ".github/workflows/format-phase4.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-phase-4-auth-continuity
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: >-
          npx prettier --write
          src/features/auth/cloud-restore-model.ts
          src/features/auth/cloud-restore.ts
          src/features/timetable/store.tsx
          tests/cloud-restore-model.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/auth/cloud-restore-model.ts src/features/auth/cloud-restore.ts src/features/timetable/store.tsx tests/cloud-restore-model.test.ts
          git commit -m "style: format phase 4 restore sources"
          git push origin HEAD:feat/mobile-phase-4-auth-continuity
