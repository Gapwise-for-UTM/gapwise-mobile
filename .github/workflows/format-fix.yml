name: Normalize formatting

on:
  push:
    branches: [feat/mobile-phase-2-local-day]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-phase-2-local-day
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format non-workflow files
        run: npx prettier --write . --ignore-path .github/workflows/.prettier-ignore-temp
      - name: Emit formatted CI workflow
        run: npx prettier .github/workflows/ci.yml | base64 -w0
      - name: Commit normalized formatting
        run: |
          git checkout -- .github/workflows/ci.yml .github/workflows/format-fix.yml
          if git diff --quiet; then
            echo 'Formatting already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: normalize mobile formatting'
          git push origin HEAD:feat/mobile-phase-2-local-day
