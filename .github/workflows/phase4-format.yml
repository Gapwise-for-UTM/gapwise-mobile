name: Phase 4 format repair

on:
  push:
    branches:
      - feat/mobile-phase-4-auth-continuity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-phase-4-auth-continuity
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write "app/(tabs)/more.tsx" src/features/auth/model.ts src/features/auth/session.ts src/features/auth/store.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/(tabs)/more.tsx" src/features/auth/model.ts src/features/auth/session.ts src/features/auth/store.tsx
          git commit -m "style: normalize phase 4 formatting"
          git push origin HEAD:feat/mobile-phase-4-auth-continuity
