name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Formatting
        run: npm run format:check
      - name: Source privacy audit
        run: npm run audit:source
      - name: Release configuration audit
        run: npm run audit:release
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Bundle iOS
        env:
          EXPO_PUBLIC_GAPWISE_CHANNEL: ci
          EXPO_PUBLIC_GAPWISE_COMMIT_SHA: ${{ github.sha }}
        run: npm run export:ios
      - name: Bundle Android
        env:
          EXPO_PUBLIC_GAPWISE_CHANNEL: ci
          EXPO_PUBLIC_GAPWISE_COMMIT_SHA: ${{ github.sha }}
        run: npm run export:android
      - name: Audit export privacy and footprint
        run: npm run audit:exports
      - name: Write exact-source release provenance manifest
        env:
          EXPO_PUBLIC_GAPWISE_COMMIT_SHA: ${{ github.sha }}
        run: npm run release:manifest
      - name: Preserve release provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-provenance-${{ github.sha }}
          path: dist/release-manifest.json
          if-no-files-found: error
          retention-days: 14
