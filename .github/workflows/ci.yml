name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Formatting
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee prettier-check.log
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-check-log
          path: prettier-check.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Bundle iOS
        env:
          EXPO_PUBLIC_GAPWISE_CHANNEL: ci
          EXPO_PUBLIC_GAPWISE_COMMIT_SHA: ${{ github.sha }}
        run: npm run export:ios
      - name: Bundle Android
        env:
          EXPO_PUBLIC_GAPWISE_CHANNEL: ci
          EXPO_PUBLIC_GAPWISE_COMMIT_SHA: ${{ github.sha }}
        run: npm run export:android
