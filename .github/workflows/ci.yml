name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Align Expo 57 animation peers
        run: >-
          npm install --save-exact
          react-native-reanimated@4.5.1
          react-native-worklets@0.10.1
          --no-audit --no-fund
      - name: Commit Expo peer alignment
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: align Expo 57 native animation peers"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Formatting
        run: npm run format:check
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Bundle iOS
        env:
          EXPO_PUBLIC_GAPWISE_CHANNEL: ci
          EXPO_PUBLIC_GAPWISE_COMMIT_SHA: ${{ github.sha }}
        run: npm run export:ios
      - name: Bundle Android
        env:
          EXPO_PUBLIC_GAPWISE_CHANNEL: ci
          EXPO_PUBLIC_GAPWISE_COMMIT_SHA: ${{ github.sha }}
        run: npm run export:android
