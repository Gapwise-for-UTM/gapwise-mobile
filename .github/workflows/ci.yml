name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Expo-compatible Worklets pin
        run: npm install --save-exact react-native-worklets@0.10.1 --no-audit --no-fund
      - name: Capture dependency pin
        run: git diff --exit-code -- package.json package-lock.json
      - name: Upload pinned dependency files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worklets-pin
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Formatting
        run: npm run format:check
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Bundle iOS
        env:
          EXPO_PUBLIC_GAPWISE_CHANNEL: ci
          EXPO_PUBLIC_GAPWISE_COMMIT_SHA: ${{ github.sha }}
        run: npm run export:ios
      - name: Bundle Android
        env:
          EXPO_PUBLIC_GAPWISE_CHANNEL: ci
          EXPO_PUBLIC_GAPWISE_COMMIT_SHA: ${{ github.sha }}
        run: npm run export:android
