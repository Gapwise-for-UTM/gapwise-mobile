name: Native crypto compile

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/gapwise-device-crypto/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-crypto.yml"
      - ".github/workflows/cleanup-merged-branches.yml"

concurrency:
  group: native-crypto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Compile Android app
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee ../android-compile.log
        working-directory: android
      - name: Upload Android compile diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-compile-log
          path: android-compile.log
          if-no-files-found: ignore
          retention-days: 3

  android-pre35-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Enable Android emulator hardware acceleration
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chown "$USER" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
      - name: Run API 34 RSA-OAEP-SHA256 interoperability tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            for attempt in $(seq 1 60); do
              if adb shell service check package 2>/dev/null | grep -q "Service package: found" && \
                adb shell cmd package list packages >/dev/null 2>&1; then
                break
              fi
              if [[ "$attempt" -eq 60 ]]; then
                echo "Android package manager did not become ready." >&2
                exit 1
              fi
              sleep 2
            done
            cd android
            ./gradlew :gapwise-device-crypto:connectedDebugAndroidTest --no-daemon

  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform ios --clean --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
      - run: npx pod-install ios
      - name: Compile iOS app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Gapwise.xcworkspace \
            -scheme Gapwise \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-compile.log
      - name: Upload iOS compile diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-compile-log
          path: ios-compile.log
          if-no-files-found: ignore
          retention-days: 3
