name: Refresh Expo patch lockfile

on:
  push:
    branches: [perf-memoize-timetable-derived-state]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[expo-lock-refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refresh Expo patch dependencies
        run: npx expo install expo@~57.0.18 expo-constants@~57.0.16 --npm
      - name: Commit generated manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh Expo patch lockfile [expo-lock-refreshed]"
          git push origin HEAD:perf-memoize-timetable-derived-state
